[workspace]
members = [
    "crates/registry-auth",
    "crates/registry-core",
    "crates/registry-db",
    "crates/registry-events",
    "crates/registry-agent",
    "crates/registry-server",
    "crates/registry-storage",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/knotree/knotree-registry"

[workspace.dependencies]
async-trait = "0.1"
argon2 = "0.5"
aws-config = "1.12"
aws-credential-types = "1.3"
aws-sdk-s3 = "1.148"
axum = "0.8"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
hex = "0.4"
hmac = "0.12"
http = "1"
p256 = { version = "0.13", features = ["ecdsa"] }
rand_core = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate", "macros", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }
url = "2"
